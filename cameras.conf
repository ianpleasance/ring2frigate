# One line per Ring camera: camera_name:/path/to/watch/dir
# camera_name must match what you want to see in the Frigate UI
# (letters, numbers, underscores only - no spaces or dashes)
#
# Example for 20 cameras - replace with your real names/paths:
ring_front_door:/media/ring/ring_front_door
ring_house_rear_doors:/media/ring/ring_house_rear_doors
ring_bee_hut_house:/media/ring/ring_bee_hut_house


